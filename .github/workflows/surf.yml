name: Update TRMNL Wave Forecast

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - surf_forecast.py
      - requirements.txt
      - .github/workflows/surf.yml
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Asia/Jerusalem"
    # Public repositories lose scheduled workflows after 60 days without
    # repository activity. This monthly run also refreshes a keepalive file.
    - cron: "43 12 1 * *"
      timezone: "Asia/Jerusalem"

permissions:
  contents: write

concurrency:
  group: trmnl-wave-forecast
  cancel-in-progress: true

jobs:
  update-forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Hebrew font
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Generate and upload forecast
        env:
          FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
        run: python surf_forecast.py --output forecast.png

      - name: Keep public scheduled workflow active
        if: github.event_name == 'schedule' && github.event.schedule == '43 12 1 * *'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-scheduled-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-scheduled-run
          git commit -m "chore: keep scheduled forecast active [skip ci]"
          git push

name: Push Surf Forecast to TRMNL

on:
  schedule:
    - cron: '0 5 * * *'    # 05:00 UTC daily (08:00 Israel time)
    - cron: '0 10 * * *'   # 10:00 UTC daily (13:00 Israel time)
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scraper and push image
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
        run: node run.js
